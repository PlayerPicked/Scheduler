name: Scheduler
version: '${version}'
author: "kxtsoo"
main: com.playerpicked.scheduler.Scheduler
api-version: '1.21'
folia-supported: true
description: "Cron based event scheduler with an in-game editor."

softdepend:
  - PlaceholderAPI

permissions:
  scheduler.admin:
    description: "Access to every Scheduler command."
    default: op
    children:
      scheduler.reload: true
      scheduler.editor: true
      scheduler.list: true
      scheduler.next: true
      scheduler.run: true
      scheduler.toggle: true
      scheduler.once: true
      scheduler.update-notify: true
  scheduler.reload:
    default: op
  scheduler.editor:
    default: op
  scheduler.list:
    default: op
  scheduler.next:
    default: true
  scheduler.run:
    default: op
  scheduler.toggle:
    default: op
  scheduler.update-notify:
    default: op
  scheduler.once:
    default: op
