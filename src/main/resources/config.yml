# https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: "Europe/London"

update-checker:
  enabled: true

formatting:
  # CLOCK_DD_HH_MM_SS, CLOCK_HH_MM_SS, CLOCK_MM_SS, WORDS_FULL, WORDS_COMPACT, HOURS_ONLY, MINUTES_ONLY, SECONDS_ONLY
  time-format: "WORDS_COMPACT"

actions:
  # In ticks (20 ticks = 1 second)
  title:
    fade-in: 10
    stay: 70
    fade-out: 20

  # Can be overridden per action: [SOUND] entity.player.levelup 1.0 1.5
  sound:
    volume: 1.0
    pitch: 1.0

catch-up:
  # Runs events missed while the server was offline once after startup.
  # Default for events without their own 'catch-up' option.
  enabled: false

  # Only runs missed within this window count (30m, 2h, 1d). Also applies to one-time tasks.
  max-age: "1h"

  # Seconds to wait after startup before running the missed events and tasks
  delay: 30

one-time:
  # Run one-time tasks that became due while the server was offline (within catch-up.max-age), false = drop them
  run-missed: true

editor:
  event-name-pattern: "[A-Za-z0-9_-]{1,32}"

version: 2